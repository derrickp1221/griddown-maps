name: Street map packs

# Builds an offline street map for each state from OpenStreetMap
# (Geofabrik extracts -> Planetiler -> one .pmtiles file per state).
# Run by hand from the Actions tab. "states" is a space-separated list of
# Geofabrik state names, e.g. "georgia florida". Leave it as "all" for every state.

on:
  workflow_dispatch:
    inputs:
      states:
        description: "Geofabrik state names, or all"
        default: "all"
      release:
        description: "Publish to a release with this tag (blank = artifact only)"
        default: "streets-v1"

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      states: ${{ steps.p.outputs.states }}
    steps:
      - id: p
        run: |
          ALL="alabama alaska arizona arkansas california colorado connecticut delaware district-of-columbia florida georgia hawaii idaho illinois indiana iowa kansas kentucky louisiana maine maryland massachusetts michigan minnesota mississippi missouri montana nebraska nevada new-hampshire new-jersey new-mexico new-york north-carolina north-dakota ohio oklahoma oregon pennsylvania rhode-island south-carolina south-dakota tennessee texas utah vermont virginia washington west-virginia wisconsin wyoming"
          S="${{ github.event.inputs.states }}"; [ "$S" = "all" ] && S="$ALL"
          echo "states=$(printf '%s\n' $S | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        state: ${{ fromJson(needs.plan.outputs.states) }}
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Cache Planetiler downloads (water, lakes, Natural Earth)
        uses: actions/cache@v4
        with:
          path: data/sources
          key: planetiler-sources-v1
      - name: Get Planetiler and the state extract
        run: |
          curl -sSL -o planetiler.jar https://github.com/onthegomap/planetiler/releases/latest/download/planetiler.jar
          mkdir -p data/sources
          curl -sSL -o state.osm.pbf "https://download.geofabrik.de/north-america/us/${{ matrix.state }}-latest.osm.pbf"
          ls -lh state.osm.pbf
      - name: Build tiles
        run: |
          java -Xmx10g -jar planetiler.jar \
            --osm-path=state.osm.pbf --download --download_dir=data/sources \
            --output=${{ matrix.state }}.pmtiles --force \
            --maxzoom=14 --languages=en \
            --exclude_layers=building,poi,housenumber,landcover,landuse,park,mountain_peak,aeroway \
            --nodes=ram
          ls -lh ${{ matrix.state }}.pmtiles
      - uses: actions/upload-artifact@v4
        if: github.event.inputs.release == ''
        with:
          name: ${{ matrix.state }}
          path: ${{ matrix.state }}.pmtiles
          compression-level: 0
          retention-days: 7
      - name: Publish to release
        if: github.event.inputs.release != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.event.inputs.release }}" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "${{ github.event.inputs.release }}" -R "$GITHUB_REPOSITORY" -t "Street maps ${{ github.event.inputs.release }}" -n "Offline street maps built from OpenStreetMap. Map data © OpenStreetMap contributors (ODbL). Tile schema © OpenMapTiles." || true
          gh release upload "${{ github.event.inputs.release }}" ${{ matrix.state }}.pmtiles -R "$GITHUB_REPOSITORY" --clobber
