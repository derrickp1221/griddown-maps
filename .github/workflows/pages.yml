name: Web preview maps

# Copies a few state maps from the release onto GitHub Pages, so the app's
# browser preview can read them (Pages allows that; release downloads don't).
# The phone apps download from the release, not from here.

on:
  # Refreshes the preview copies after the monthly rebuild finishes.
  schedule:
    - cron: "23 16 2 * *"
  workflow_dispatch:
    inputs:
      states:
        description: "States to put on Pages"
        default: "georgia"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - name: Get maps from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site/streets-v1
          for s in ${{ github.event.inputs.states || 'united-states georgia south-carolina florida' }}; do
            gh release download streets-v1 -R "$GITHUB_REPOSITORY" -p "$s.pmtiles" -D site/streets-v1
          done
          echo '<!doctype html><title>Grid Down maps</title><p>Map files for the Grid Down app. Map data © OpenStreetMap contributors (ODbL), © OpenMapTiles.</p>' > site/index.html
          ls -lh site/streets-v1
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: d
        uses: actions/deploy-pages@v4
  # GitHub pauses scheduled jobs in repos with no activity for 60 days, so record each refresh.
  keep-active:
    needs: pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +"%Y-%m-%d" > last-build.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last-build.txt && git commit -m "Monthly map refresh $(cat last-build.txt)" && git push || true
